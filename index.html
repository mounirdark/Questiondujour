<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La question du jour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Karla:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cacao: #3A2519;
    --caramel: #C98E5B;
    --creme: #F7ECDC;
    --or: #D8A94A;
    --rose: #E8A3AE;
    --lilas: #BBA8E6;
    --brume: #DCC3A8;
    --discret: #7A5A47;
  }
  * { box-sizing: border-box; }
  html { background: var(--cacao); }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--creme);
    font-family: 'Karla', system-ui, sans-serif;
    font-size: 1.05rem;
    line-height: 1.5;
  }

  /* Fond : des tickets illustrés (teckel, bijoux, cœurs) */
  .fond {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    opacity: .17;
  }

  main {
    max-width: 32rem;
    margin: 0 auto;
    padding: 1.5rem 1.25rem 4rem;
  }

  /* Porte-clés teckel, accroché au-dessus de la question */
  .porte-cles {
    display: block;
    width: 150px;
    height: auto;
    margin: 0 0 .5rem;
    transform-origin: 50% 8%;
    animation: balancer 2.6s ease-out 1 both;
  }
  @keyframes balancer {
    0%   { transform: rotate(12deg); }
    25%  { transform: rotate(-8deg); }
    50%  { transform: rotate(5deg); }
    75%  { transform: rotate(-2deg); }
    100% { transform: rotate(0); }
  }

  .date { color: var(--brume); margin: 0 0 .75rem; font-size: .95rem; }
  h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-size: clamp(1.7rem, 6.2vw, 2.3rem);
    line-height: 1.2;
    margin: 0 0 1.75rem;
  }
  textarea {
    width: 100%;
    min-height: 9rem;
    resize: vertical;
    padding: 1rem;
    border: 0;
    border-radius: 14px;
    background: var(--creme);
    color: var(--cacao);
    font: inherit;
    line-height: 1.5;
  }
  textarea::placeholder { color: var(--discret); }
  button {
    margin-top: 1rem;
    padding: .85rem 1.5rem;
    border: 0;
    border-radius: 999px;
    background: var(--or);
    color: var(--cacao);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: .55; cursor: default; }
  textarea:focus-visible, button:focus-visible {
    outline: 3px solid var(--or);
    outline-offset: 3px;
  }

  .reponses { display: grid; gap: 1.1rem; }

  /* Les réponses sont des tickets : encoches sur les côtés */
  .carte {
    --r: 11px;
    background: var(--creme);
    color: var(--cacao);
    border-radius: 10px;
    padding: 1.05rem 1.7rem 1.2rem;
    -webkit-mask:
      radial-gradient(circle var(--r) at 0 50%, #0000 97%, #000) left / 51% 100% no-repeat,
      radial-gradient(circle var(--r) at 100% 50%, #0000 97%, #000) right / 51% 100% no-repeat;
    mask:
      radial-gradient(circle var(--r) at 0 50%, #0000 97%, #000) left / 51% 100% no-repeat,
      radial-gradient(circle var(--r) at 100% 50%, #0000 97%, #000) right / 51% 100% no-repeat;
  }
  .carte.autre { background: #F6D6D9; }
  .carte .nom {
    margin: 0 0 .45rem;
    padding-bottom: .45rem;
    border-bottom: 2px dotted rgba(58, 37, 25, .35);
    font-weight: 600;
    font-size: .92rem;
    color: var(--discret);
  }
  .carte .nom::before { content: "\2665\00a0"; color: #C9556A; }
  .carte .texte { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }

  .scelle {
    border: 2px dashed var(--caramel);
    border-radius: 10px;
    padding: 1rem 1.7rem 1.1rem;
    color: var(--brume);
  }
  .scelle .nom { margin: 0 0 .35rem; font-weight: 600; font-size: .92rem; }
  .scelle .texte { margin: 0; }

  .ouverture { transform-origin: top center; animation: ouvrir .8s ease-out both; }
  @keyframes ouvrir {
    from { opacity: 0; transform: perspective(600px) rotateX(-80deg); }
    to   { opacity: 1; transform: perspective(600px) rotateX(0); }
  }
  .note { margin: 1.5rem 0 0; color: var(--brume); font-size: .95rem; }
  .erreur { color: #FFC9C0; margin: 1rem 0 0; }
  @media (prefers-reduced-motion: reduce) {
    .ouverture, .porte-cles { animation: none; }
  }
</style>
</head>
<body>

<!-- Dessins réutilisables -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <!-- Ticket avec encoches et pointillés -->
    <symbol id="ticket" viewBox="0 0 150 84">
      <path d="M6 0H144Q150 0 150 6V34A8 8 0 0 0 150 50V78Q150 84 144 84H6Q0 84 0 78V50A8 8 0 0 0 0 34V6Q0 0 6 0Z" fill="var(--tk)"/>
      <path d="M108 8V76" stroke="#3A2519" stroke-opacity=".45" stroke-width="1.6" stroke-dasharray="3 4" fill="none"/>
      <use href="#coeur" x="116" y="30" width="24" height="24" style="fill:#3A2519;fill-opacity:.45"/>
    </symbol>

    <symbol id="coeur" viewBox="0 0 24 24">
      <path d="M12 21s-8.5-5.4-8.5-11.5A4.7 4.7 0 0 1 12 6.8a4.7 4.7 0 0 1 8.5 2.7C20.5 15.6 12 21 12 21z"/>
    </symbol>

    <!-- Teckel de profil, une fleur dans la gueule -->
    <symbol id="teckel" viewBox="0 0 120 56">
      <path d="M98 22Q110 14 112 5" fill="none" stroke="var(--corps,#2B1A12)" stroke-width="5" stroke-linecap="round"/>
      <g stroke="var(--contour,#D8A94A)" stroke-width="1.5" stroke-linejoin="round">
        <rect x="29" y="30" width="9" height="22" rx="4.5" fill="var(--pattes,#9A5428)"/>
        <rect x="41" y="30" width="9" height="22" rx="4.5" fill="var(--pattes,#9A5428)"/>
        <rect x="78" y="30" width="9" height="22" rx="4.5" fill="var(--pattes,#9A5428)"/>
        <rect x="90" y="30" width="9" height="22" rx="4.5" fill="var(--pattes,#9A5428)"/>
        <rect x="20" y="14" width="84" height="27" rx="13.5" fill="var(--corps,#2B1A12)"/>
        <ellipse cx="22" cy="25" rx="14" ry="12.5" fill="var(--corps,#2B1A12)"/>
        <ellipse cx="9" cy="32" rx="9" ry="6.5" fill="var(--pattes,#9A5428)"/>
        <path d="M27 15Q41 19 37 40Q23 41 24 24Z" fill="var(--oreille,#4A2E20)"/>
      </g>
      <circle cx="2.5" cy="30" r="2.7" fill="#1A0F0A"/>
      <path d="M15 23Q18.5 19.5 22 23" fill="none" stroke="#1A0F0A" stroke-width="1.8" stroke-linecap="round"/>
      <g transform="translate(5 38)">
        <circle cx="0" cy="-3.2" r="2.6" fill="#F2B6C2"/><circle cx="3" cy="-1" r="2.6" fill="#F2B6C2"/>
        <circle cx="1.8" cy="2.6" r="2.6" fill="#F2B6C2"/><circle cx="-1.8" cy="2.6" r="2.6" fill="#F2B6C2"/>
        <circle cx="-3" cy="-1" r="2.6" fill="#F2B6C2"/><circle cx="0" cy="0" r="1.7" fill="#F4C84A"/>
      </g>
    </symbol>

    <symbol id="bague" viewBox="0 0 64 64">
      <circle cx="32" cy="42" r="14" fill="none" stroke="#D8A94A" stroke-width="5"/>
      <path d="M25 21L28.5 11H35.5L39 21L32 28Z" fill="#F7ECDC" stroke="#B98A2E" stroke-width="2" stroke-linejoin="round"/>
    </symbol>

    <symbol id="boucle" viewBox="0 0 64 64">
      <circle cx="32" cy="9" r="4.5" fill="none" stroke="#D8A94A" stroke-width="3"/>
      <path d="M32 14V24" stroke="#D8A94A" stroke-width="3"/>
      <path d="M32 24C21 35 23 54 32 57C41 54 43 35 32 24Z" fill="#F7ECDC" stroke="#D8A94A" stroke-width="3" stroke-linejoin="round"/>
    </symbol>

    <symbol id="collier" viewBox="0 0 64 64">
      <path d="M6 8Q32 52 58 8" fill="none" stroke="#D8A94A" stroke-width="3" stroke-dasharray="1 4.5" stroke-linecap="round"/>
      <use href="#coeur" x="20" y="32" width="24" height="24" style="fill:#C9556A;stroke:#D8A94A;stroke-width:1.6"/>
    </symbol>

    <!-- Motif de fond -->
    <pattern id="motif" width="460" height="380" patternUnits="userSpaceOnUse">
      <g transform="translate(24 28) rotate(-8)">
        <use href="#ticket" width="150" height="84" style="--tk:#C98E5B"/>
        <use href="#teckel" x="12" y="20" width="88" height="41" style="--corps:#2B1A12;--pattes:#8A4B25;--oreille:#4A2E20;--contour:#FFF1C9"/>
      </g>
      <g transform="translate(262 40) rotate(7)">
        <use href="#ticket" width="150" height="84" style="--tk:#F7ECDC"/>
        <use href="#bague" x="22" y="10" width="64" height="64"/>
      </g>
      <g transform="translate(36 212) rotate(5)">
        <use href="#ticket" width="150" height="84" style="--tk:#E8A3AE"/>
        <use href="#boucle" x="22" y="10" width="64" height="64"/>
      </g>
      <g transform="translate(254 226) rotate(-6)">
        <use href="#ticket" width="150" height="84" style="--tk:#BBA8E6"/>
        <use href="#collier" x="22" y="10" width="64" height="64"/>
      </g>
      <use href="#coeur" x="214" y="150" width="20" height="20" style="fill:#E8A3AE" transform="rotate(-14 224 160)"/>
      <use href="#coeur" x="420" y="150" width="16" height="16" style="fill:#C9556A"/>
      <use href="#coeur" x="150" y="340" width="18" height="18" style="fill:#E8A3AE" transform="rotate(12 159 349)"/>
      <use href="#coeur" x="10" y="150" width="14" height="14" style="fill:#C98E5B"/>
      <use href="#coeur" x="410" y="345" width="22" height="22" style="fill:#E8A3AE" transform="rotate(-10 421 356)"/>
    </pattern>
  </defs>
</svg>

<svg class="fond" aria-hidden="true" focusable="false"><rect width="100%" height="100%" fill="url(#motif)"/></svg>

<main>
  <!-- Porte-clés teckel (clin d'œil à la photo de référence) -->
  <svg class="porte-cles" viewBox="0 0 130 118" aria-hidden="true" focusable="false">
    <circle cx="65" cy="22" r="19" fill="none" stroke="#D8A94A" stroke-width="4.5"/>
    <path d="M65 42V54" stroke="#D8A94A" stroke-width="4" stroke-linecap="round"/>
    <use href="#teckel" x="4" y="56" width="122" height="57" style="--corps:#2B1A12;--pattes:#D9723A;--oreille:#3A2519;--contour:#D8A94A"/>
  </svg>
  <p class="date" id="date"></p>
  <h1 id="question">&nbsp;</h1>
  <div id="scene" aria-live="polite"></div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ====== À MODIFIER ======
  const SUPABASE_URL = 'https://kkrzixbydtdgggerrqlu.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_l0J5vdikguoSeKwW7Sigog_uJQr7WR-';
  // Jour de la première question (AAAA-MM-JJ). Chaque jour suivant passe à la question suivante.
  const START_DATE = '2026-10-22';
  const QUESTIONS = [
    "Imagine le rendez-vous idéal à deux. Où sommes-nous, quelle heure est-il, et qu'est-ce qui le rend inoubliable ?",
    "Raconte un moment de ta vie qui a changé ta façon de voir les choses. Que s'est-il passé, et qu'en as-tu gardé ?",
    "Une journée ensemble en dépensant presque rien : à quoi ressemblerait-elle pour que tu t'en souviennes longtemps ?",
    "Quel conseil donnerais-tu à la personne que tu étais il y a dix ans ?",
    "Une soirée à la maison, rien que nous deux. Qu'est-ce qu'on cuisine, qu'est-ce qu'on écoute, et comment se termine-t-elle ?",
    "De quoi as-tu besoin pour te sentir en sécurité dans une relation ? D'où te vient ce besoin ?",
    "Si je te préparais une surprise, qu'est-ce qui la rendrait parfaite pour toi ? Et qu'est-ce qui la gâcherait ?",
    "Quelle peur te retient le plus aujourd'hui ? Que ferais-tu si elle disparaissait demain ?",
    "Dans quel endroit as-tu envie de m'emmener, et qu'espères-tu que j'y comprenne de toi ?",
    "Qui a le plus influencé ta façon d'aimer ? Qu'est-ce que cette personne t'a appris, en bien comme en moins bien ?",
    "Quelle activité aimerais-tu essayer avec moi, même si on est nuls tous les deux au début ? Imagine la scène.",
    "Quel rêve te suit depuis longtemps ? Qu'est-ce qui t'empêche encore de le vivre ?",
    "Il pleut dehors et nous n'avons rien de prévu. Décris-moi la soirée parfaite.",
    "Comment aimes-tu qu'on te dise les choses difficiles ? Où places-tu la frontière entre honnêteté et blessure ?",
    "Le bord de mer, la montagne ou une ville inconnue : lequel te fait le plus rêver pour un rendez-vous à deux, et pourquoi ?",
    "Quelle réussite compte le plus pour toi, même si personne ne la voit ? Pourquoi celle-là ?",
    "Quel petit rituel aimerais-tu inventer avec moi : une balade, un café, une playlist, une lettre ? Pourquoi celui-là ?",
    "Qu'est-ce que tu te reproches encore ? Que te faudrait-il pour réussir à te le pardonner ?",
    "Compose la playlist de notre prochain rendez-vous : cinq chansons, et ce que chacune raconte de ce moment.",
    "Dans une mauvaise période, de quoi as-tu besoin : de présence, de silence, de solutions ? Comment aimerais-tu que je sois là ?",
    "Quel est le rendez-vous le plus romantique que tu aies vécu ou imaginé ? Qu'est-ce qui l'a rendu si particulier ?",
    "Décris un dimanche ordinaire dans ta vie idéale, dans dix ans.",
    "Après une journée difficile, quel rendez-vous te ferait le plus de bien ? Dis-moi aussi ce que je pourrais faire ou dire.",
    "Où te sens-tu le mieux pour te ressourcer ? Qu'est-ce que cet endroit a de particulier pour toi ?",
    "Quand on se verra, quel moment de la journée aimerais-tu garder rien que pour nous ? Que ferait-on ?",
    "Quelle différence entre nous t'intrigue, te surprend ou te plaît ? Pourquoi ?",
    "Raconte-moi nos retrouvailles telles que tu les imagines, de la porte qui s'ouvre jusqu'à la fin de la soirée.",
    "Que signifie pour toi prendre soin de quelqu'un ? Donne-moi des gestes précis.",
    "Une journée entière, sans contrainte, où tu veux : où va-t-on, et comment se déroule-t-elle ?",
    "Quelle qualité as-tu mis longtemps à reconnaître en toi ? Qu'est-ce qui t'a aidé à la voir ?"
  ];
  // ========================

  const INTERVALLE_MS = 15000;
  const code = new URLSearchParams(location.search).get('k');
  let client = null;
  let erreurConfig = null;
  try {
    if (!window.supabase) {
      throw new Error("la bibliothèque Supabase n'a pas pu se charger (connexion, ou bloqueur de publicités).");
    }
    if (SUPABASE_URL.includes('TON-PROJET') || SUPABASE_ANON_KEY.includes('TA_CLE')) {
      throw new Error("remplace SUPABASE_URL et SUPABASE_ANON_KEY en haut du script par les valeurs de ton projet Supabase.");
    }
    client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  } catch (e) {
    erreurConfig = e.message;
  }
  const scene = document.getElementById('scene');

  // Affiche à l'écran toute erreur inattendue (utile sur téléphone, sans console).
  window.addEventListener('error', (e) => {
    const p = document.createElement('p');
    p.className = 'erreur';
    p.textContent = 'Erreur : ' + e.message;
    scene.append(p);
  });

  const aujourdhui = new Date();
  const jour = aujourdhui.toLocaleDateString('en-CA'); // AAAA-MM-JJ
  const decalage = Math.round((Date.parse(jour) - Date.parse(START_DATE)) / 86400000);
  const question = QUESTIONS[((decalage % QUESTIONS.length) + QUESTIONS.length) % QUESTIONS.length];

  document.getElementById('date').textContent =
    aujourdhui.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
  document.getElementById('question').textContent = question;

  let moi = null, autre = null, minuteur = null, etaitEnAttente = false;

  function el(tag, classe, texte) {
    const e = document.createElement(tag);
    if (classe) e.className = classe;
    if (texte !== undefined) e.textContent = texte;
    return e;
  }
  function vider() { clearInterval(minuteur); minuteur = null; scene.replaceChildren(); }
  function carte(classe, nom, texte) {
    const c = el('div', classe);
    c.append(el('p', 'nom', nom), el('p', 'texte', texte));
    return c;
  }
  function message(texte, classe) { vider(); scene.append(el('p', classe || 'note', texte)); }

  function afficherFormulaire() {
    vider();
    const zone = el('textarea');
    zone.maxLength = 1000;
    zone.placeholder = 'Ta réponse…';
    zone.setAttribute('aria-label', 'Ta réponse');
    const bouton = el('button', null, 'Envoyer ma réponse');
    const erreur = el('p', 'erreur');
    bouton.addEventListener('click', async () => {
      const texte = zone.value.trim();
      if (!texte) { zone.focus(); return; }
      bouton.disabled = true;
      erreur.textContent = '';
      const { error } = await client.rpc('repondre', { p_code: code, p_jour: jour, p_texte: texte });
      if (error) {
        erreur.textContent = "L'envoi a échoué. Vérifie ta connexion et réessaie.";
        bouton.disabled = false;
        return;
      }
      charger();
    });
    scene.append(zone, bouton, erreur);
  }

  function afficherAttente(texte) {
    vider();
    etaitEnAttente = true;
    const bloc = el('div', 'reponses');
    bloc.append(
      carte('carte', 'Ta réponse', texte),
      (() => {
        const s = el('div', 'scelle');
        s.append(el('p', 'nom', 'Réponse de ' + autre),
                 el('p', 'texte', 'Elle apparaîtra ici dès que ' + autre + ' aura répondu.'));
        return s;
      })()
    );
    scene.append(bloc);
    minuteur = setInterval(charger, INTERVALLE_MS);
  }

  function afficherRevele(lignes) {
    vider();
    const mienne = lignes.find(l => l.prenom === moi);
    const sienne = lignes.find(l => l.prenom !== moi);
    const bloc = el('div', 'reponses');
    bloc.append(carte('carte', 'Ta réponse', mienne.texte));
    const c2 = carte('carte autre' + (etaitEnAttente ? ' ouverture' : ''), 'Réponse de ' + autre, sienne.texte);
    bloc.append(c2);
    scene.append(bloc, el('p', 'note', 'Une nouvelle question arrive demain.'));
  }

  async function charger() {
    const { data, error } = await client.rpc('voir', { p_code: code, p_jour: jour });
    if (error) { message("Impossible de charger les réponses pour l'instant. Réessaie dans un moment.", 'erreur'); return; }
    const mienne = data.find(l => l.prenom === moi);
    if (data.some(l => l.revele)) afficherRevele(data);
    else if (mienne) afficherAttente(mienne.texte);
    else afficherFormulaire();
  }

  async function demarrer() {
    if (erreurConfig) { message('Configuration : ' + erreurConfig, 'erreur'); return; }
    if (!code) { message("Ce lien est incomplet. Utilise le lien complet qui t'a été envoyé.", 'erreur'); return; }
    const { data, error } = await client.rpc('qui_suis_je', { p_code: code });
    if (error) { message("Connexion impossible pour l'instant. Réessaie dans un moment.", 'erreur'); return; }
    if (!data || !data.length) { message("Ce lien ne fonctionne pas. Utilise le lien complet qui t'a été envoyé.", 'erreur'); return; }
    moi = data[0].moi;
    autre = data[0].autre;
    charger();
  }
  demarrer();
</script>
</body>
</html>
